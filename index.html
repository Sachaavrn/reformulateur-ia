<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReformIA</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      options: { renderActions: { addMenu: [] } },
      chtml: {
        scale: 0.85,
        matchFontHeight: false,
        minScale: 0.5
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --violet-900: #4a1fb8;
      --violet-700: #6d3df0;
      --violet-500: #8f6bff;
      --violet-100: #f1ebff;
      --white: #ffffff;
      --text: #22203a;
      --muted: #6b6890;
      --shadow: 0 16px 40px rgba(74, 31, 184, 0.18);
      --radius: 16px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #ffffff 0%, #f5f1ff 40%, #efe7ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .app {
      width: 100%;
      max-width: 920px;
      background: var(--white);
      border: 1px solid #ece7ff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      box-sizing: border-box;
    }

    .header {
      background: linear-gradient(120deg, var(--violet-900), var(--violet-700));
      color: var(--white);
      padding: 26px 28px;
    }

    .header h1 { margin: 0; font-size: 1.9rem; }
    .header p { margin: 8px 0 0; opacity: 0.95; }

    .content {
      padding: 24px 28px 28px;
      display: grid;
      gap: 18px;
      box-sizing: border-box;
      width: 100%;
    }

    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ece7ff;
      padding-bottom: 10px;
    }

    .tab-btn {
      border: 1px solid #d9ccff;
      border-radius: 999px;
      padding: 9px 16px;
      background: var(--violet-100);
      color: var(--violet-900);
      font-weight: 600;
      cursor: pointer;
      font: inherit;
    }

    .tab-btn.active {
      background: linear-gradient(120deg, var(--violet-900), var(--violet-700));
      color: var(--white);
      box-shadow: 0 8px 18px rgba(109, 61, 240, 0.25);
    }

    .tab-panel { display: grid; gap: 18px; }
    .tab-panel[hidden] { display: none; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--violet-900);
    }

    textarea, select {
      width: 100%;
      border: 1px solid #ddd5ff;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: #fcfbff;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.45;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: var(--violet-500);
      box-shadow: 0 0 0 4px rgba(143, 107, 255, 0.15);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      cursor: pointer;
      border: none;
      box-sizing: border-box;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet-100), var(--violet-500));
      border: 1px solid #ddd5ff;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-900), var(--violet-700));
      box-shadow: 0 4px 14px rgba(109, 61, 240, 0.35);
      border: 3px solid var(--white);
    }

    input[type="range"]::-moz-range-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet-100), var(--violet-500));
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-900), var(--violet-700));
      border: 3px solid var(--white);
    }

    .grade-display {
      margin: 10px 0 0;
      font-weight: 600;
      color: var(--violet-900);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    button:active { transform: translateY(1px); }

    .btn-primary {
      background: linear-gradient(120deg, var(--violet-900), var(--violet-700));
      color: var(--white);
      box-shadow: 0 8px 18px rgba(109, 61, 240, 0.3);
    }

    .btn-secondary {
      background: var(--violet-100);
      color: var(--violet-900);
    }

    .btn-secondary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Zone de résultat */
    .output {
      border: 1px dashed #cbbdff;
      border-radius: 12px;
      background: #faf8ff;
      padding: 14px;
      min-height: 140px;
      line-height: 1.6;
      color: #2b2450;
      word-break: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
      width: 100%;
    }

    #outputText {
      white-space: pre-wrap;
    }

    #mathPanel,
    #mathPanel > div {
      min-width: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    .math-output-parent {
      min-width: 0;
      width: 100%;
    }

    .math-output-wrapper {
      width: calc(100% - 0px) !important;
      max-width: 100% !important;
      min-width: 0 !important;
      flex-shrink: 1 !important;
      align-self: stretch !important;
    }

    #mathOutput {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      word-break: break-word;
      overflow-wrap: break-word;
      line-height: 1.7;
      color: #2b2450;
    }

    #mathOutput h3 {
      font-size: 1.05rem;
      margin: 16px 0 8px;
      color: var(--violet-900);
      word-break: break-word;
    }

    #mathOutput h4 {
      font-size: 0.95rem;
      margin: 12px 0 6px;
      word-break: break-word;
    }

    #mathOutput p {
      margin: 8px 0;
      word-break: break-word;
    }

    #mathOutput strong {
      word-break: break-word;
    }

    /* MathJax - scroll horizontal sur les formules larges seulement */
    mjx-container[display="true"] {
      overflow-x: auto;
      overflow-y: hidden;
      display: block;
      max-width: 100%;
      padding-bottom: 4px;
    }

    mjx-container:not([display="true"]) {
      display: inline-block;
      max-width: 100%;
    }

    .hint { font-size: 0.9rem; color: var(--muted); margin: 0; }

    .image-picker { display: none; }

    .upload-zone {
      margin-top: 10px;
      border: 2px dashed #cbbdff;
      border-radius: 12px;
      background: #faf8ff;
      padding: 14px;
      transition: border-color 0.2s;
      box-sizing: border-box;
      width: 100%;
    }

    .upload-zone.dragover {
      border-color: var(--violet-500);
      background: #f4efff;
    }

    .upload-zone-text {
      margin: 0;
      color: var(--violet-900);
      font-weight: 600;
      text-align: center;
    }

    .preview-wrap {
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }

    .preview-wrap[hidden] { display: none; }

    .preview-image {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 1px dashed #cbbdff;
      border-radius: 12px;
      background: #faf8ff;
      padding: 8px;
      box-sizing: border-box;
    }

    .remove-image-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(45, 45, 56, 0.72);
      color: var(--white);
      font-size: 16px;
      cursor: pointer;
      max-width: 28px;
    }

    .remove-image-btn:hover { background: #d62f45; }

    @media (max-width: 640px) {
      .header, .content { padding: 16px; }
      .header h1 { font-size: 1.4rem; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>ReformIA</h1>
      <p>Réécris un texte IA avec un style naturel selon ton niveau scolaire.</p>
    </header>

    <section class="content">
      <div class="tabs">
        <button class="tab-btn active" data-tab-target="reformulatePanel" type="button">Reformulateur</button>
        <button class="tab-btn" data-tab-target="mathPanel" type="button">Maths</button>
      </div>

      <!-- ONGLET REFORMULATEUR -->
      <section id="reformulatePanel" class="tab-panel">
        <div>
          <label>Texte à reformuler</label>
          <textarea id="inputText" placeholder="Colle ici un texte généré par une IA..."></textarea>
          <div class="controls" style="margin-top:10px">
            <button class="btn-secondary" id="reformulateImageBtn" type="button">Importer une photo</button>
            <input class="image-picker" id="reformulateImageInput" type="file" accept="image/*">
          </div>
          <div id="reformulateDropZone" class="upload-zone" tabindex="0">
            <p id="reformulateDropText" class="upload-zone-text">Glisse une photo ici ou colle (Ctrl+V)</p>
            <div id="reformulatePreviewWrap" class="preview-wrap" hidden>
              <img id="reformulatePreview" class="preview-image" alt="Aperçu">
              <button class="remove-image-btn" id="reformulateRemoveImageBtn" type="button" hidden>✕</button>
            </div>
          </div>
        </div>

        <div>
          <label>Niveau scolaire</label>
          <select id="level">
            <option>6ème</option><option>5ème</option><option>4ème</option>
            <option>3ème</option><option>2nde</option><option>1ère</option>
            <option>Terminale</option>
          </select>
        </div>

        <div>
          <label>Note visée</label>
          <input type="range" id="targetGrade" min="0" max="20" step="1" value="14">
          <p id="gradeDisplay" class="grade-display">Note visée : 14/20</p>
        </div>

        <div class="controls">
          <button class="btn-primary" id="reformulateBtn">Reformuler</button>
          <button class="btn-secondary" id="copyBtn" disabled>Copier le résultat</button>
        </div>

        <div>
          <label>Résultat</label>
          <div id="outputText" class="output">Le texte reformulé apparaîtra ici.</div>
        </div>
      </section>

      <!-- ONGLET MATHS -->
      <section id="mathPanel" class="tab-panel" hidden>
        <div>
          <label>Niveau de maths</label>
          <select id="mathLevel">
            <option>6ème</option><option>5ème</option><option>4ème</option>
            <option>3ème</option><option>2nde</option><option>STMG</option><option>1ère</option>
            <option>Terminale Spécialité</option>
            <option>Terminale Maths Expertes</option>
            <option>Post-Bac (sans limite)</option>
          </select>
        </div>

        <div>
          <label>Note visée</label>
          <input type="range" id="mathTargetGrade" min="0" max="20" step="1" value="14">
          <p id="mathGradeDisplay" class="grade-display">Note visée : 14/20</p>
        </div>

        <div>
          <label>Exercice</label>
          <textarea id="mathInput" placeholder="Colle ou écris ici ton exercice de maths..."></textarea>
          <div class="controls" style="margin-top:10px">
            <button class="btn-secondary" id="mathImageBtn" type="button">Importer une photo</button>
            <input class="image-picker" id="mathImageInput" type="file" accept="image/*">
          </div>
          <div id="mathDropZone" class="upload-zone" tabindex="0">
            <p id="mathDropText" class="upload-zone-text">Glisse une photo ici ou colle (Ctrl+V)</p>
            <div id="mathPreviewWrap" class="preview-wrap" hidden>
              <img id="mathPreview" class="preview-image" alt="Aperçu exercice">
              <button class="remove-image-btn" id="mathRemoveImageBtn" type="button" hidden>✕</button>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="btn-primary" id="solveBtn">Résoudre</button>
          <button class="btn-secondary" id="mathCopyBtn" disabled>Copier la correction</button>
        </div>

        <div class="math-output-parent">
          <label>Correction</label>
          <div class="math-output-wrapper" style="overflow-x:auto; overflow-y:visible; -webkit-overflow-scrolling:touch; border:1px dashed #cbbdff; border-radius:12px; background:#faf8ff; padding:14px; box-sizing:border-box; min-height:140px;">
            <div id="mathOutput" style="min-width:0; word-break:break-word; line-height:1.7;">La correction apparaîtra ici.</div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    // ---- ONGLETS ----
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".tab-panel").forEach(p => {
          p.hidden = p.id !== btn.dataset.tabTarget;
        });
      });
    });

    // ---- CURSEURS ----
    const targetGrade = document.getElementById("targetGrade");
    const gradeDisplay = document.getElementById("gradeDisplay");
    const mathTargetGrade = document.getElementById("mathTargetGrade");
    const mathGradeDisplay = document.getElementById("mathGradeDisplay");

    targetGrade.addEventListener("input", () => {
      gradeDisplay.textContent = `Note visée : ${targetGrade.value}/20`;
    });
    mathTargetGrade.addEventListener("input", () => {
      mathGradeDisplay.textContent = `Note visée : ${mathTargetGrade.value}/20`;
    });

    // ---- API ----
    async function callChatApi(payload) {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.error?.message || "Erreur API");
      return data;
    }

    // ---- IMAGES ----
    let reformulateImageDataUrl = "";
    let persistedMathImageDataUrl = "";

    function readFile(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error("Impossible de lire l'image."));
        r.readAsDataURL(file);
      });
    }

    async function applyImage(file, previewImg, previewWrap, removeBtn, dropText, outputEl) {
      if (!file || !file.type.startsWith("image/")) throw new Error("Fichier invalide.");
      const url = await readFile(file);
      previewImg.src = url;
      previewWrap.hidden = false;
      removeBtn.hidden = false;
      dropText.hidden = true;
      if (outputEl) outputEl.textContent = "Photo importée. Lance la requête.";
      return url;
    }

    function clearImage(input, previewImg, previewWrap, removeBtn, dropText) {
      input.value = "";
      previewImg.removeAttribute("src");
      previewWrap.hidden = true;
      removeBtn.hidden = true;
      dropText.hidden = false;
    }

    function getImageFromClipboard(e) {
      for (const item of (e.clipboardData?.items || [])) {
        if (item.type.startsWith("image/")) return item.getAsFile();
      }
      return null;
    }

    function setupDrop({ zone, input, previewImg, previewWrap, removeBtn, dropText, outputEl, onLoad }) {
      input.addEventListener("change", async () => {
        try {
          const url = await applyImage(input.files[0], previewImg, previewWrap, removeBtn, dropText, outputEl);
          onLoad(url);
        } catch (e) { if (outputEl) outputEl.textContent = e.message; }
      });

      zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("dragover"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
      zone.addEventListener("drop", async e => {
        e.preventDefault(); zone.classList.remove("dragover");
        const f = Array.from(e.dataTransfer?.files || []).find(f => f.type.startsWith("image/"));
        if (!f) return;
        try { const url = await applyImage(f, previewImg, previewWrap, removeBtn, dropText, outputEl); onLoad(url); }
        catch (e) { if (outputEl) outputEl.textContent = e.message; }
      });

      zone.addEventListener("paste", async e => {
        const f = getImageFromClipboard(e);
        if (!f) return;
        e.preventDefault();
        try { const url = await applyImage(f, previewImg, previewWrap, removeBtn, dropText, outputEl); onLoad(url); }
        catch (e) { if (outputEl) outputEl.textContent = e.message; }
      });
    }

    // Setup reformulateur
    const rImgBtn = document.getElementById("reformulateImageBtn");
    const rImgInput = document.getElementById("reformulateImageInput");
    const rDropZone = document.getElementById("reformulateDropZone");
    const rDropText = document.getElementById("reformulateDropText");
    const rPreviewWrap = document.getElementById("reformulatePreviewWrap");
    const rPreview = document.getElementById("reformulatePreview");
    const rRemoveBtn = document.getElementById("reformulateRemoveImageBtn");
    const outputText = document.getElementById("outputText");
    const copyBtn = document.getElementById("copyBtn");

    rImgBtn.addEventListener("click", () => rImgInput.click());
    setupDrop({
      zone: rDropZone, input: rImgInput, previewImg: rPreview,
      previewWrap: rPreviewWrap, removeBtn: rRemoveBtn, dropText: rDropText,
      outputEl: outputText, onLoad: url => { reformulateImageDataUrl = url; copyBtn.disabled = true; }
    });
    rRemoveBtn.addEventListener("click", () => {
      reformulateImageDataUrl = "";
      clearImage(rImgInput, rPreview, rPreviewWrap, rRemoveBtn, rDropText);
      outputText.textContent = "Photo supprimée.";
      copyBtn.disabled = true;
    });

    // Setup maths
    const mImgBtn = document.getElementById("mathImageBtn");
    const mImgInput = document.getElementById("mathImageInput");
    const mDropZone = document.getElementById("mathDropZone");
    const mDropText = document.getElementById("mathDropText");
    const mPreviewWrap = document.getElementById("mathPreviewWrap");
    const mPreview = document.getElementById("mathPreview");
    const mRemoveBtn = document.getElementById("mathRemoveImageBtn");
    const mathOutput = document.getElementById("mathOutput");
    const mathCopyBtn = document.getElementById("mathCopyBtn");

    mImgBtn.addEventListener("click", () => mImgInput.click());
    setupDrop({
      zone: mDropZone, input: mImgInput, previewImg: mPreview,
      previewWrap: mPreviewWrap, removeBtn: mRemoveBtn, dropText: mDropText,
      outputEl: mathOutput, onLoad: url => { persistedMathImageDataUrl = url; }
    });
    mRemoveBtn.addEventListener("click", () => {
      persistedMathImageDataUrl = "";
      clearImage(mImgInput, mPreview, mPreviewWrap, mRemoveBtn, mDropText);
      mathOutput.textContent = "Photo supprimée.";
      mathCopyBtn.disabled = true;
    });

    // Ctrl+V global
    document.addEventListener("paste", async e => {
      const f = getImageFromClipboard(e);
      if (!f) return;
      e.preventDefault();
      const isMath = !document.getElementById("mathPanel").hidden;
      try {
        if (isMath) {
          persistedMathImageDataUrl = await applyImage(f, mPreview, mPreviewWrap, mRemoveBtn, mDropText, mathOutput);
        } else {
          reformulateImageDataUrl = await applyImage(f, rPreview, rPreviewWrap, rRemoveBtn, rDropText, outputText);
          copyBtn.disabled = true;
        }
      } catch (e) { console.error(e); }
    });

    // ---- REFORMULER ----
    const reformulateBtn = document.getElementById("reformulateBtn");
    const level = document.getElementById("level");

    reformulateBtn.addEventListener("click", async () => {
      const text = document.getElementById("inputText").value.trim();
      const lvl = level.value;
      const note = Number(targetGrade.value);

      if (!text && !reformulateImageDataUrl) {
        outputText.textContent = "Colle un texte ou importe une photo avant de reformuler.";
        return;
      }

      reformulateBtn.disabled = true;
      reformulateBtn.textContent = "Reformulation en cours...";
      copyBtn.disabled = true;
      outputText.textContent = "En cours...";

      const systemPrompt = `Tu es un assistant qui réécrit des textes générés par une IA pour qu'ils semblent écrits naturellement par un élève français de niveau ${lvl}. Adapte le vocabulaire, la syntaxe et le style. Le texte doit sembler authentique.\n\nNote visée ${note}/20 :\n- 17-20 : quasi parfait, vocabulaire riche\n- 13-16 : quelques maladresses, 1-2 fautes\n- 10-12 : fautes légères, répétitions\n- 6-9 : fautes visibles, style pauvre\n- 0-5 : nombreuses fautes, hors sujet partiel\n\nRéponds UNIQUEMENT avec le texte reformulé.`;

      try {
        const userMsg = reformulateImageDataUrl
          ? { role: "user", content: [
              { type: "text", text: text || "Reformule le texte de cette image." },
              { type: "image_url", image_url: { url: reformulateImageDataUrl } }
            ]}
          : { role: "user", content: text };

        const data = await callChatApi({
          model: reformulateImageDataUrl ? "meta-llama/llama-4-scout-17b-16e-instruct" : "llama-3.3-70b-versatile",
          temperature: 0.7,
          messages: [{ role: "system", content: systemPrompt }, userMsg]
        });

        const result = data?.choices?.[0]?.message?.content?.trim() || "";
        if (!result) throw new Error("Réponse vide.");
        outputText.textContent = result;
        copyBtn.disabled = false;
      } catch (e) {
        outputText.textContent = `Erreur : ${e.message}`;
        copyBtn.disabled = true;
      } finally {
        reformulateBtn.disabled = false;
        reformulateBtn.textContent = "Reformuler";
      }
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(outputText.textContent);
        copyBtn.textContent = "Copié !";
        setTimeout(() => copyBtn.textContent = "Copier le résultat", 1400);
      } catch { copyBtn.textContent = "Erreur"; setTimeout(() => copyBtn.textContent = "Copier le résultat", 1400); }
    });

    // ---- MATHS ----
    const solveBtn = document.getElementById("solveBtn");
    const mathLevel = document.getElementById("mathLevel");

    async function renderMathJax() {
      if (window.MathJax?.typesetPromise) await window.MathJax.typesetPromise([mathOutput]);
    }

    function markdownToHtml(text) {
      return text
        .replace(/^### (.+)$/gm, "<h4>$1</h4>")
        .replace(/^## (.+)$/gm, "<h3>$1</h3>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n{2,}/g, "</p><p>")
        .replace(/\n/g, "<br>")
        .replace(/^/, "<p>").replace(/$/, "</p>");
    }

    solveBtn.addEventListener("click", async () => {
      const exercise = document.getElementById("mathInput").value.trim();
      const lvl = mathLevel.value;
      const note = Number(mathTargetGrade.value);

      if (!exercise && !persistedMathImageDataUrl) {
        mathOutput.textContent = "Écris un exercice ou importe une photo.";
        return;
      }

      solveBtn.disabled = true;
      solveBtn.textContent = "Résolution en cours...";
      mathCopyBtn.disabled = true;
      mathOutput.textContent = "En cours...";

      const postBacOption = "Post-Bac (sans limite)";
      const ordreQuestions =
        "réponds question par question dans l'ordre de l'exercice. N'invente pas d'étapes supplémentaires. Indique le numéro de chaque question (1. / 2.a. / etc.) puis donne la réponse. Présentation comme sur une copie d'élève français.";
      const piedNoteGrade =
        `\n\nNote visée ${note}/20 :\n` +
        "- 17-20 : correction parfaite\n- 13-16 : quelques erreurs légères\n- 10-12 : erreurs visibles, raisonnement incomplet\n- 6-9 : erreurs fréquentes, confus\n- 0-5 : nombreuses erreurs\n\n" +
        "N'écris pas la note dans ta réponse.";
      const answerRulesStandard =
        ordreQuestions.charAt(0).toUpperCase() + ordreQuestions.slice(1) + piedNoteGrade;

      let systemPrompt;
      if (lvl === postBacOption) {
        systemPrompt =
          "Tu es un expert en mathématiques. Résous cet exercice avec le niveau de rigueur et de détail approprié, sans restriction de programme.\n\n" +
          answerRulesStandard;
      } else if (lvl === "STMG") {
        systemPrompt =
          "Tu es un professeur de maths français. L'élève est en Terminale STMG.\n\n" +
          "Programme de Terminale STMG : statistiques, suites arithmétiques et géométriques, fonctions du second degré, mathématiques financières. Pas de dérivées complexes ni de probabilités avancées.\n\n" +
          `RÈGLE 1 : Si l'exercice contient des notions absentes de ce cadre STMG, réponds UNIQUEMENT :\n"❌ Cet exercice dépasse le programme STMG choisi.\nNotions hors programme : [liste].\nChange le niveau ou l'exercice."\n\n` +
          `RÈGLE 2 : Sinon, réponds question par question dans l'ordre de l'exercice. N'invente pas d'étapes supplémentaires. Indique le numéro de chaque question (1. / 2.a. / etc.) puis donne la réponse. Utilise uniquement les méthodes adaptées au programme STMG. Présentation comme sur une copie d'élève français.\n\n` +
          `Note visée ${note}/20 :\n` +
          "- 17-20 : correction parfaite\n- 13-16 : quelques erreurs légères\n- 10-12 : erreurs visibles, raisonnement incomplet\n- 6-9 : erreurs fréquentes, confus\n- 0-5 : nombreuses erreurs\n\n" +
          "N'écris pas la note dans ta réponse.";
      } else {
        systemPrompt =
          `Tu es un professeur de maths français. L'élève est en ${lvl}.\n\n` +
          `RÈGLE 1 : Si l'exercice contient des notions absentes du programme de ${lvl}, réponds UNIQUEMENT :\n"❌ Cet exercice ne correspond pas au niveau ${lvl}.\nNotions hors programme : [liste].\nChange le niveau ou l'exercice."\n\n` +
          `RÈGLE 2 : Si le niveau est correct, ${ordreQuestions}` +
          piedNoteGrade;
      }

      try {
        const userMsg = persistedMathImageDataUrl
          ? { role: "user", content: [
              { type: "text", text: exercise || "Résous l'exercice de cette image." },
              { type: "image_url", image_url: { url: persistedMathImageDataUrl } }
            ]}
          : { role: "user", content: exercise };

        const data = await callChatApi({
          model: persistedMathImageDataUrl ? "meta-llama/llama-4-scout-17b-16e-instruct" : "llama-3.3-70b-versatile",
          temperature: 0.3,
          messages: [{ role: "system", content: systemPrompt }, userMsg]
        });

        const result = data?.choices?.[0]?.message?.content?.trim() || "";
        if (!result) throw new Error("Réponse vide.");

        mathOutput.innerHTML = markdownToHtml(result);

        // Restaurer la photo
        if (persistedMathImageDataUrl) {
          mPreview.src = persistedMathImageDataUrl;
          mPreviewWrap.hidden = false;
          mRemoveBtn.hidden = false;
          mDropText.hidden = true;
        }

        await renderMathJax();
        mathCopyBtn.disabled = false;
      } catch (e) {
        mathOutput.textContent = `Erreur : ${e.message}`;
        mathCopyBtn.disabled = true;
      } finally {
        solveBtn.disabled = false;
        solveBtn.textContent = "Résoudre";
      }
    });

    mathCopyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(mathOutput.textContent);
        mathCopyBtn.textContent = "Copié !";
        setTimeout(() => mathCopyBtn.textContent = "Copier la correction", 1400);
      } catch { mathCopyBtn.textContent = "Erreur"; setTimeout(() => mathCopyBtn.textContent = "Copier la correction", 1400); }
    });
  </script>
</body>
</html>
