<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReformIA</title>
  <style>
    :root {
      --violet-900: #4a1fb8;
      --violet-700: #6d3df0;
      --violet-500: #8f6bff;
      --violet-100: #f1ebff;
      --white: #ffffff;
      --text: #22203a;
      --muted: #6b6890;
      --shadow: 0 16px 40px rgba(74, 31, 184, 0.18);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #ffffff 0%, #f5f1ff 40%, #efe7ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(920px, 100%);
      background: var(--white);
      border: 1px solid #ece7ff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(120deg, var(--violet-900), var(--violet-700));
      color: var(--white);
      padding: 26px 28px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.3px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: 0.95;
    }

    .content {
      padding: 24px 28px 28px;
      display: grid;
      gap: 18px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ece7ff;
      padding-bottom: 10px;
    }

    .tab-btn {
      border: 1px solid #d9ccff;
      border-radius: 999px;
      padding: 9px 16px;
      background: var(--violet-100);
      color: var(--violet-900);
      font-weight: 600;
    }

    .tab-btn.active {
      background: linear-gradient(120deg, var(--violet-900), var(--violet-700));
      color: var(--white);
      box-shadow: 0 8px 18px rgba(109, 61, 240, 0.25);
    }

    .tab-panel {
      display: grid;
      gap: 18px;
    }

    .tab-panel[hidden] {
      display: none;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--violet-900);
    }

    textarea,
    select,
    input {
      width: 100%;
      border: 1px solid #ddd5ff;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: #fcfbff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.45;
    }

    textarea:focus,
    select:focus,
    input:focus {
      outline: none;
      border-color: var(--violet-500);
      box-shadow: 0 0 0 4px rgba(143, 107, 255, 0.15);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      cursor: pointer;
      border: none;
    }

    input[type="range"]:focus {
      box-shadow: none;
      outline: none;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--violet-500);
      outline-offset: 4px;
      border-radius: 999px;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet-100), var(--violet-500));
      border: 1px solid #ddd5ff;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-900), var(--violet-700));
      box-shadow: 0 4px 14px rgba(109, 61, 240, 0.35);
      border: 3px solid var(--white);
    }

    input[type="range"]::-moz-range-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet-100), var(--violet-500));
      border: 1px solid #ddd5ff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-900), var(--violet-700));
      box-shadow: 0 4px 14px rgba(109, 61, 240, 0.35);
      border: 3px solid var(--white);
    }

    .grade-display {
      margin: 10px 0 0;
      font-weight: 600;
      color: var(--violet-900);
      font-size: 1rem;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(120deg, var(--violet-900), var(--violet-700));
      color: var(--white);
      box-shadow: 0 8px 18px rgba(109, 61, 240, 0.3);
    }

    .btn-secondary {
      background: var(--violet-100);
      color: var(--violet-900);
    }

    .btn-secondary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .output {
      border: 1px dashed #cbbdff;
      border-radius: 12px;
      background: #faf8ff;
      padding: 14px;
      min-height: 140px;
      white-space: pre-wrap;
      line-height: 1.5;
      color: #2b2450;
    }

    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0;
    }

    @media (max-width: 640px) {
      .header,
      .content {
        padding: 18px;
      }

      .header h1 {
        font-size: 1.55rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>ReformIA</h1>
      <p>Réécris un texte IA avec un style plus naturel selon ton niveau scolaire.</p>
    </header>

    <section class="content">
      <div>
        <label for="apiKey">Clé API Groq</label>
        <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="reformulateTabBtn" data-tab-target="reformulatePanel" type="button">Reformulateur</button>
        <button class="tab-btn" id="mathTabBtn" data-tab-target="mathPanel" type="button">Maths</button>
      </div>

      <section id="reformulatePanel" class="tab-panel">
        <div>
          <label for="inputText">Texte à reformuler</label>
          <textarea id="inputText" placeholder="Colle ici un texte généré par une IA..."></textarea>
        </div>

        <div>
          <label for="level">Niveau scolaire</label>
          <select id="level">
            <option value="6ème">6ème</option>
            <option value="5ème">5ème</option>
            <option value="4ème">4ème</option>
            <option value="3ème">3ème</option>
            <option value="2nde">2nde</option>
            <option value="1ère">1ère</option>
            <option value="Terminale">Terminale</option>
          </select>
        </div>

        <div>
          <label for="targetGrade">Note visée</label>
          <input type="range" id="targetGrade" min="0" max="20" step="1" value="14" aria-describedby="gradeDisplay">
          <p id="gradeDisplay" class="grade-display">Note visée : 14/20</p>
        </div>

        <div class="controls">
          <button class="btn-primary" id="reformulateBtn">Reformuler</button>
          <button class="btn-secondary" id="copyBtn" disabled>Copier le résultat</button>
        </div>

        <div>
          <label for="outputText">Résultat</label>
          <div id="outputText" class="output">Le texte reformulé apparaîtra ici.</div>
          <p class="hint">Ta clé API est utilisée uniquement dans cette page pour appeler Groq.</p>
        </div>
      </section>

      <section id="mathPanel" class="tab-panel" hidden>
        <div>
          <label for="mathLevel">Niveau de maths</label>
          <select id="mathLevel">
            <option value="6ème">6ème</option>
            <option value="5ème">5ème</option>
            <option value="4ème">4ème</option>
            <option value="3ème">3ème</option>
            <option value="2nde">2nde</option>
            <option value="1ère">1ère</option>
            <option value="Terminale Spécialité">Terminale Spécialité</option>
            <option value="Terminale Maths Expertes">Terminale Maths Expertes</option>
          </select>
        </div>

        <div>
          <label for="mathInput">Exercice</label>
          <textarea id="mathInput" placeholder="Colle ou écris ici ton exercice de maths..."></textarea>
        </div>

        <div class="controls">
          <button class="btn-primary" id="solveBtn">Résoudre</button>
        </div>

        <div>
          <label for="mathOutput">Correction</label>
          <div id="mathOutput" class="output">La correction apparaîtra ici.</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const apiKeyInput = document.getElementById("apiKey");
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels = document.querySelectorAll(".tab-panel");

    const reformulateBtn = document.getElementById("reformulateBtn");
    const copyBtn = document.getElementById("copyBtn");
    const inputText = document.getElementById("inputText");
    const level = document.getElementById("level");
    const targetGrade = document.getElementById("targetGrade");
    const gradeDisplay = document.getElementById("gradeDisplay");
    const outputText = document.getElementById("outputText");
    const solveBtn = document.getElementById("solveBtn");
    const mathLevel = document.getElementById("mathLevel");
    const mathInput = document.getElementById("mathInput");
    const mathOutput = document.getElementById("mathOutput");
    const defaultButtonText = "Reformuler";
    const loadingButtonText = "Reformulation en cours...";
    const defaultSolveButtonText = "Résoudre";
    const loadingSolveButtonText = "Résolution en cours...";

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const targetId = button.dataset.tabTarget;

        tabButtons.forEach((tabButton) => {
          tabButton.classList.remove("active");
        });
        button.classList.add("active");

        tabPanels.forEach((panel) => {
          panel.hidden = panel.id !== targetId;
        });
      });
    });

    function updateGradeDisplay() {
      gradeDisplay.textContent =
        `Note visée : ${targetGrade.value}/20`;
    }
    targetGrade.addEventListener("input", updateGradeDisplay);

    reformulateBtn.addEventListener("click", async () => {
      const apiKey = apiKeyInput.value.trim();
      const authorizationHeader = `Bearer ${apiKey}`;
      const original = inputText.value.trim();
      const selectedLevel = level.value;
      const noteVisee = Number(targetGrade.value);

      if (!apiKey) {
        outputText.textContent = "Merci d'entrer ta clé API Groq avant de reformuler.";
        copyBtn.disabled = true;
        return;
      }

      if (!original) {
        outputText.textContent = "Merci de coller un texte avant de cliquer sur Reformuler.";
        copyBtn.disabled = true;
        return;
      }

      const systemPrompt =
        `Tu es un assistant qui réécrit des textes générés par une IA pour qu'ils ` +
        `semblent écrits naturellement par un élève français de niveau ${selectedLevel}. ` +
        `Adapte le vocabulaire, la syntaxe et le style à ce niveau scolaire. ` +
        `Le texte doit sembler authentique, pas parfait, naturel.` +
        `\n\nRéférence de qualité (note sur 20 comme sur une copie) :\n` +
        `- Note 17-20 : texte quasi parfait, vocabulaire riche, aucune faute\n` +
        `- Note 13-16 : quelques maladresses, style correct, 1 ou 2 petites fautes\n` +
        `- Note 10-12 : fautes légères, formulations moyennes, répétitions\n` +
        `- Note 6-9 : fautes visibles, argumentation faible, style pauvre\n` +
        `- Note 0-5 : nombreuses fautes, hors sujet partiel, style très faible\n\n` +
        `Pour cette reformulation, vise précisément la note ${noteVisee}/20 : calibre ` +
        `le texte final (erreurs orthographiques/grammaticales, richesse lexicale, ` +
        `fluide mais imparfait le cas échéant, niveau d'argumentation, répétitions) ` +
        `pour correspondre à ce barème sans mentionner la note ni les consignes. ` +
        `Réponds uniquement avec le texte reformulé, rien d'autre.`;

      reformulateBtn.disabled = true;
      reformulateBtn.textContent = loadingButtonText;
      copyBtn.disabled = true;
      outputText.textContent = "Traitement de la reformulation...";

      try {
        console.log("Authorization header envoyé :", authorizationHeader);
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: authorizationHeader
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            temperature: 0.7,
            messages: [
              {
                role: "system",
                content: systemPrompt
              },
              {
                role: "user",
                content: original
              }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const apiMessage = data && data.error && data.error.message
            ? data.error.message
            : "Erreur API inconnue.";
          throw new Error(apiMessage);
        }

        const resultText = data && data.choices && data.choices[0] &&
          data.choices[0].message && typeof data.choices[0].message.content === "string"
          ? data.choices[0].message.content.trim()
          : "";

        if (!resultText) {
          throw new Error("Aucun texte reformulé n'a été renvoyé par Groq.");
        }

        outputText.textContent = resultText;
        copyBtn.disabled = false;
      } catch (error) {
        outputText.textContent =
          `Impossible de reformuler le texte : ${error.message}\n` +
          "Vérifie ta clé API, ta connexion internet et réessaie.";
        copyBtn.disabled = true;
      } finally {
        reformulateBtn.disabled = false;
        reformulateBtn.textContent = defaultButtonText;
      }
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(outputText.textContent);
        copyBtn.textContent = "Copié !";
        setTimeout(() => {
          copyBtn.textContent = "Copier le résultat";
        }, 1400);
      } catch (error) {
        copyBtn.textContent = "Impossible de copier";
        setTimeout(() => {
          copyBtn.textContent = "Copier le résultat";
        }, 1400);
      }
    });

    solveBtn.addEventListener("click", async () => {
      const apiKey = apiKeyInput.value.trim();
      const authorizationHeader = `Bearer ${apiKey}`;
      const selectedMathLevel = mathLevel.value;
      const exercise = mathInput.value.trim();

      if (!apiKey) {
        mathOutput.textContent = "Merci d'entrer ta clé API Groq avant de résoudre.";
        return;
      }

      if (!exercise) {
        mathOutput.textContent = "Merci d'écrire ou coller un exercice avant de cliquer sur Résoudre.";
        return;
      }

      const systemPrompt =
        `Tu es un professeur de mathématiques français expert. ` +
        `L'élève est en ${selectedMathLevel}. Résous cet exercice étape par étape ` +
        `en utilisant UNIQUEMENT les notions et le vocabulaire du programme officiel français de ce niveau. ` +
        `Rédige la correction exactement comme un élève de ce niveau le ferait en classe, ` +
        `avec la présentation attendue par un prof français. ` +
        `Ne jamais utiliser de notions qui ne sont pas encore au programme.`;

      solveBtn.disabled = true;
      solveBtn.textContent = loadingSolveButtonText;
      mathOutput.textContent = "Traitement de la correction...";

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: authorizationHeader
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            temperature: 0.3,
            messages: [
              {
                role: "system",
                content: systemPrompt
              },
              {
                role: "user",
                content: exercise
              }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const apiMessage = data && data.error && data.error.message
            ? data.error.message
            : "Erreur API inconnue.";
          throw new Error(apiMessage);
        }

        const resultText = data && data.choices && data.choices[0] &&
          data.choices[0].message && typeof data.choices[0].message.content === "string"
          ? data.choices[0].message.content.trim()
          : "";

        if (!resultText) {
          throw new Error("Aucune correction n'a été renvoyée par Groq.");
        }

        mathOutput.textContent = resultText;
      } catch (error) {
        mathOutput.textContent =
          `Impossible de résoudre l'exercice : ${error.message}\n` +
          "Vérifie ta clé API, ta connexion internet et réessaie.";
      } finally {
        solveBtn.disabled = false;
        solveBtn.textContent = defaultSolveButtonText;
      }
    });
  </script>
</body>
</html>
